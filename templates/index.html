<!-- ===================================================================
     Customer Segmentation Dashboard -- form UI for app.py
     Plain server-rendered HTML form (no JS): submits via POST to "/",
     Flask re-renders this same template with `result` or `error` filled in.
     =================================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Segmentation Dashboard</title>
    <style>
        /* --- Page shell: centers a single white card on a light-grey background --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;   /* horizontally centers .container */
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;               /* fills up to 600px, shrinks on mobile */
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        /* --- Form fields laid out as a responsive 2-column grid --- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;   /* two equal columns; not responsive below this width */
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;   /* label stacked above input */
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;              /* removes default focus ring -- border color is the only focus cue */
        }
        button {
            grid-column: span 2;        /* spans both grid columns, full width */
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #357abd;
        }
        /* --- Result/error banners shown after a POST --- */
        .alert {
            margin-top: 25px;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background-color: #e2f0d9;
            color: #385723;
            border: 1px solid #c5e1b4;
        }
        .error {
            background-color: #fce4d6;
            color: #c65911;
            border: 1px solid #f8cbad;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Customer Segmentation Predictor</h2>

    <!-- Standard HTML Form submitting directly back to the server (no fetch/JS) -->
    <form action="/" method="POST">
        <div class="form-grid">

            <!-- Each block below: one numeric input, pre-filled with the last
                 submitted value (or the default from app.py's form_data dict) -->

            <div class="form-group">
                <label for="AnnualIncome">Annual Income ($)</label>
                <input type="number" name="AnnualIncome" id="AnnualIncome" step="any" required value="{{ form_data.AnnualIncome }}">
                <!-- step="any" + no min: negative income can be submitted -->
            </div>
            <div class="form-group">
                <label for="TotalSpend">Total Spend ($)</label>
                <input type="number" name="TotalSpend" id="TotalSpend" step="any" required value="{{ form_data.TotalSpend }}">
                <!-- no min: negative spend can be submitted -->
            </div>
            <div class="form-group">
                <label for="PurchaseFrequencyPerMonth">Purchases / Month</label>
                <input type="number" name="PurchaseFrequencyPerMonth" id="PurchaseFrequencyPerMonth" step="any" required value="{{ form_data.PurchaseFrequencyPerMonth }}">
            </div>
            <div class="form-group">
                <label for="WebsiteVisitsPerMonth">Website Visits / Month</label>
                <input type="number" name="WebsiteVisitsPerMonth" id="WebsiteVisitsPerMonth" step="any" required value="{{ form_data.WebsiteVisitsPerMonth }}">
            </div>
            <div class="form-group">
                <label for="AppUsageHoursPerMonth">App Usage (Hours/Mo)</label>
                <input type="number" name="AppUsageHoursPerMonth" id="AppUsageHoursPerMonth" step="any" required value="{{ form_data.AppUsageHoursPerMonth }}">
            </div>
            <div class="form-group">
                <label for="DiscountUsesPerYear">Discount Uses / Year</label>
                <input type="number" name="DiscountUsesPerYear" id="DiscountUsesPerYear" step="any" required value="{{ form_data.DiscountUsesPerYear }}">
                <!-- count-like field but no min="0" -- negative "uses" is nonsensical but accepted -->
            </div>
            <div class="form-group">
                <label for="Returns">Items Returned</label>
                <input type="number" name="Returns" id="Returns" step="any" required value="{{ form_data.Returns }}">
                <!-- same issue: count-like field, no min="0" -->
            </div>
            <div class="form-group">
                <label for="LastPurchaseDays">Days Since Last Purchase</label>
                <input type="number" name="LastPurchaseDays" id="LastPurchaseDays" step="any" required value="{{ form_data.LastPurchaseDays }}">
                <!-- same issue: days can't be negative in practice, but no min="0" -->
            </div>

            <button type="submit">🔮 Predict Segment</button>
        </div>
    </form>

    <!-- Jinja conditions: exactly one of these renders per request, based on
         what app.py passed into render_template() -->
    {% if result %}
        <div class="alert success">🎉 Success! {{ result }}</div>
        <!-- {{ result }} is plain text built by app.py (f-string), not user-controlled
             HTML, so this is safe from injection given Jinja's autoescaping -->
    {% endif %}

    {% if error %}
        <div class="alert error">❌ Error: {{ error }}</div>
        <!-- NOTE: this renders str(e) directly from app.py's except block --
             e.g. a Python NameError/traceback message could leak here in production.
             Fine for local debugging, but map errors to friendly messages before
             deploying, so users never see raw exception text. -->
    {% endif %}
</div>

</body>
</html>
